name: Publica imagens no GHCR

# Constroi backend e frontend a cada push no master e implanta o que mudou.
#
# Nao ha tag "latest": producao aponta para digest no docker-compose.prod.yml,
# e uma tag movel so serviria para alguem puxar a imagem errada.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.servico }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - servico: backend
            contexto: ./backend
            imagem: siteestatisticas-backend
          - servico: frontend
            contexto: ./frontend
            imagem: siteestatisticas-frontend

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.imagem }}
          tags: |
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}

  # Publicar nao e implantar: quem implanta e o commit abaixo. O CI escreve o
  # digest recem-publicado no docker-compose.prod.yml e commita no master; o
  # Portainer acompanha este arquivo e aplica em ate 5 minutos.
  #
  # So troca o digest do servico cuja pasta mudou. Build nunca sai com o mesmo
  # digest, e trocar os dois sempre reiniciaria o backend por causa de uma
  # mudanca so no frontend.
  #
  # Esse commit e o registro do deploy: `git revert` nele volta a versao
  # anterior. O push feito com GITHUB_TOKEN nao dispara este workflow de novo.
  implanta:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: implanta

    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Escreve o digest novo no compose de producao
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Execucao antiga nao implanta por cima de uma mais nova: se entrou
          # commit de codigo depois deste (os do bot nao contam), a execucao
          # dele implanta.
          # Filtra pelo ASSUNTO: --invert-grep --grep testava cada linha da
          # mensagem, e um commit humano com "deploy:" no corpo passava por
          # commit do bot. O awk le tudo (sem exit): com pipefail, sair cedo
          # mataria o git log por SIGPIPE e derrubaria o job.
          novo=$(git log --format='%H%x09%s' "${GITHUB_SHA}..HEAD" | awk -F'\t' '!f && $2 !~ /^deploy:/ {print $1; f=1}')
          if [ -n "$novo" ]; then
            echo "Ha commit mais novo ($novo); a execucao dele implanta."; exit 0
          fi

          mudou=""
          for servico in backend frontend; do
            img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/siteestatisticas-${servico}"
            # Compara com o commit que esta EM PRODUCAO (o :sha- anotado no
            # compose), nao com o push anterior: deploy que falhou ou foi
            # cancelado entra na proxima execucao em vez de se perder.
            ultimo=$(grep -oE "${img}:sha-[0-9a-f]+" docker-compose.prod.yml | head -1 | sed 's/.*:sha-//' || true)
            if [ "$EVENTO" = push ] && [ -n "$ultimo" ] && git cat-file -e "${ultimo}^{commit}" 2>/dev/null; then
              if ! git diff --name-only "$ultimo" "$GITHUB_SHA" | grep -q "^${servico}/"; then
                continue
              fi
            fi
            digest=$(docker buildx imagetools inspect "${img}:sha-${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)
            # Digest vazio apagaria a imagem do compose e derrubaria o servico.
            if ! echo "$digest" | grep -qxE 'sha256:[0-9a-f]{64}'; then
              echo "Digest invalido para ${img}: '${digest}'"; exit 1
            fi
            sed -i -E "s#(${img})@sha256:[0-9a-f]+#\1@${digest}#; s#(${img}):sha-[0-9a-f]+#\1:sha-${GITHUB_SHA}#" docker-compose.prod.yml
            # Linha que nao casou (imagem renomeada, dono novo) nao pode passar em verde.
            if ! grep -qF "${img}@${digest}" docker-compose.prod.yml; then
              echo "A linha image: de ${img} nao foi encontrada no compose"; exit 1
            fi
            mudou="$mudou $servico"
          done

          if git diff --quiet -- docker-compose.prod.yml; then
            echo "Nada a implantar: nenhum servico mudou desde o que esta em producao."; exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "deploy:$mudou no commit ${GITHUB_SHA:0:8}

          Para reverter esta implantacao: git revert deste commit." -- docker-compose.prod.yml
          # Merge que entrou entre o checkout e o push: rebase e tenta de novo.
          for tentativa in 1 2 3; do
            git push -q origin HEAD:master && exit 0
            sleep 5; git pull -q --rebase origin master
          done
          echo "O push do commit de deploy falhou 3 vezes"; exit 1
