name: Publica imagens no GHCR

# Constroi backend e frontend a cada push no master.
#
# ATENCAO: este workflow NAO publica a tag "latest", de proposito. O repositorio
# estava parado desde 2023 quando o build automatico foi criado, e a imagem em
# producao pode ser mais nova que o codigo daqui. Publicar "latest" sobrescreveria
# uma referencia possivelmente em uso.
#
# Depois de confirmar que o codigo do repositorio corresponde ao que roda,
# adicione "type=raw,value=latest" nas tags abaixo.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.servico }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - servico: backend
            contexto: ./backend
            imagem: siteestatisticas-backend
          - servico: frontend
            contexto: ./frontend
            imagem: siteestatisticas-frontend

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.imagem }}
          tags: |
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}
