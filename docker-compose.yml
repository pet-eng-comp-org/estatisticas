version: "2.1"

services:
  estatisticas_backend:
    container_name: estatisticas_backend
    build:
      context: ./backend
    environment:
      TOKEN_SECRET: desejotodaasortedomundoparaquemestamexendonisso
      BACKEND_PORT: 2020
    ports:
      - 2020:2020
    networks:
      - estatisticas
      - traefik
    
    labels:
      - traefik.enable=true
      - traefik.http.routers.estatisticasbackend.entrypoints=http
      - traefik.http.routers.estatisticasbackend.rule=Host(`$API_ESTATISTICAS_URL`)
      - traefik.docker.network=traefik

  estatisticas_frontend:
    container_name: estatisticas_frontend
    build:
      context: ./frontend
    stdin_open: true
    depends_on:
      - estatisticas_backend
    environment:
      API_URL: "http://172.25.0.2:2020/"
      PORT: 2121
    ports:
      - 2121:2121
    networks:
      - estatisticas
      - traefik

    labels:
      - traefik.enable=true
      - traefik.http.routers.estatisticasfrontend.entrypoints=http
      - traefik.http.routers.estatisticasfrontend.rule=Host(`$ESTATISTICAS_URL`)
      - traefik.docker.network=traefik

networks:
  estatisticas:
    driver: bridge
    name: estatisticas
  traefik:
    name: traefik
    external: true