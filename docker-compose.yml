version: "2.1"

services:
  estatisticas_backend:
    container_name: estatisticas_backend
    build:
      context: ./backend
    environment:
      TOKEN_SECRET: $TOKEN_SECRET
      BACKEND_PORT: 2020
      # O banco vive num volume, fora da imagem, para sobreviver a redeploy.
      DATABASE_PATH: /app/data/database.sqlite
    volumes:
      - estatisticas_dados:/app/data
    ports:
      - 2020:2020
    networks:
      - estatisticas
      - traefik
    
    labels:
      - traefik.enable=true
      - traefik.http.routers.estatisticasbackend.entrypoints=web, websecure
      - traefik.http.routers.estatisticasbackend.tls=true
      - traefik.http.routers.estatisticasbackend.tls.certresolver=production
      - traefik.http.routers.estatisticasbackend.rule=Host(`$API_ESTATISTICAS_URL`)
      - traefik.http.services.estatisticasbackend.loadbalancer.server.port=2020
      - traefik.docker.network=$TRAEFIK_NETWORK

  estatisticas_frontend:
    container_name: estatisticas_frontend
    build:
      context: ./frontend
    depends_on:
      - estatisticas_backend
    environment:
      # Lida no boot para gerar o config.js que o index.html carrega.
      REACT_APP_API_URL: $API_ESTATISTICAS_URL_FULL
    # O nginx que serve o bundle escuta na 80; 2121 e so por onde o host
    # alcanca em desenvolvimento. Antes a imagem rodava o servidor do
    # create-react-app, que obedecia a variavel PORT -- o nginx nao.
    ports:
      - 2121:80
    networks:
      - estatisticas
      - traefik

    labels:
      - traefik.enable=true
      - traefik.http.routers.estatisticasfrontend.entrypoints=web, websecure
      - traefik.http.routers.estatisticasfrontend.tls=true
      - traefik.http.routers.estatisticasfrontend.tls.certresolver=production
      - traefik.http.routers.estatisticasfrontend.rule=Host(`$ESTATISTICAS_URL`)
      - traefik.http.services.estatisticasfrontend.loadbalancer.server.port=80
      - traefik.docker.network=$TRAEFIK_NETWORK

volumes:
  estatisticas_dados:
    name: estatisticas_dados

networks:
  estatisticas:
    driver: bridge
    name: estatisticas
  traefik:
    name: $TRAEFIK_NETWORK
    external: true