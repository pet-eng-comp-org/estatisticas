version: "2.1"

services:
  estatisticas_backend:
    container_name: estatisticas_backend
    build:
      context: ./backend
    environment:
      TOKEN_SECRET: $API_TOKEN_SECRET
      BACKEND_PORT: 2020
    ports:
      - 2020:2020
    networks:
      - estatisticas
      - traefik

  estatisticas_frontend:
    container_name: estatisticas_frontend
    build:
      context: ./frontend
    stdin_open: true
    depends_on:
      - backend
    environment:
      API_URL: estatisticas_backend
      PORT: 2121
    ports:
      - 2121:2121
    networks:
      - estatisticas
      - traefik

    labels:
      - traefik.enable=true
      - traefik.http.routers.estatisticasfrontend.entrypoints=http
      - traefik.http.routers.estatisticasfrontend.rule=Host(`$ESTATISTICAS_URL`)
      - traefik.docker.network=$TRAEFIK_NETWORK

networks:
  estatisticas:
    driver: bridge
    name: estatisticas
  traefik:
    name: $TRAEFIK_NETWORK
    external: true