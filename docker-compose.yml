version: "2.1"

services:
  backend:
    build:
      context: ./backend
    environment:
      TOKEN_SECRET: $API_TOKEN_SECRET
    networks:
      - estatisticas
      - traefik

  frontend:
    build:
      context: ./frontend
    stdin_open: true
    depends_on:
      - backend
    environment:
      API_URL: backend
    networks:
      - estatisticas
      - traefik

    labels:
      - traefik.enable=true
      - traefik.http.routers.estatisticasfrontend.entrypoints=http
      - traefik.http.routers.estatisticasfrontend.rule=Host(`$ESTATISTICAS_URL`)
      - traefik.docker.network=$TRAEFIK_NETWORK

networks:
  estatisticas:
    driver: bridge
    name: estatisticas
  traefik:
    name: $TRAEFIK_NETWORK
    external: true