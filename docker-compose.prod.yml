# PRODUCAO — este arquivo e a stack `estatisticas` na VM do PET.
#
# O Portainer puxa este caminho deste repositorio e aplica sozinho quando ele
# muda. Ou seja: **mexer aqui implanta**. A linha `image:` quem escreve e o
# CI, a cada push no master (job `implanta` em .github/workflows/ci.yml).
#
# Um container so: o site em Next le o banco SQLite do volume. Nao ha mais API
# publica separada (apiestatisticas.pet.inf.ufes.br) nem variavel secreta.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  estatisticas:
    container_name: estatisticas
    # ghcr.io/pet-eng-comp-org/estatisticas:sha-9832eaf4e54ffb9c4374a21f37e23ac0924f5c3a
    image: ghcr.io/pet-eng-comp-org/estatisticas@sha256:a0ac0af26621eea969fb58a47f59ba39c830c15dbdfbc4b22b07496eef66be26
    logging: *logging
    restart: always
    # Mesmo volume do site anterior. Na primeira subida o banco novo
    # (estatisticas.db) e criado a partir do antigo (database.sqlite), que so e
    # lido: voltar de versao continua funcionando.
    volumes:
      - data:/dados
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.estatisticas.entrypoints=web, websecure
      - traefik.http.routers.estatisticas.tls=true
      - traefik.http.routers.estatisticas.tls.certresolver=le
      - traefik.http.routers.estatisticas.rule=Host(`estatistica.pet.inf.ufes.br`)
      - traefik.http.services.estatisticas.loadbalancer.server.port=3000
      - traefik.docker.network=traefik

volumes:
  # Externo: apagar ou recriar a stack nao leva o banco junto.
  # Copiado de estatisticas_dados em 10/10/2026 (padrao <stack>_<conteudo>).
  data:
    external: true
    name: estatisticas_data

networks:
  # A rede e da stack do Traefik: apagar esta stack nao pode tentar remove-la.
  traefik:
    name: traefik
    external: true
