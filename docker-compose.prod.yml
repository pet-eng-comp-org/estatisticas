# PRODUCAO — este arquivo e a stack `estatisticas` na VM do PET.
#
# O Portainer puxa este caminho deste repositorio e aplica sozinho quando ele
# muda. Ou seja: **mexer aqui implanta**. As linhas `image:` quem escreve e o
# CI, a cada push no master (job `implanta` em publica-imagens.yml).
#
# `${TOKEN_SECRET}` e referencia: o valor vive nas variaveis da stack, dentro
# do Portainer, e nunca entra no git.
#
# Para rodar na sua maquina, use docker-compose.yml, que e outro arquivo e tem
# outra finalidade.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    # ghcr.io/pet-eng-comp-org/siteestatisticas-backend:sha-8f88f3db5afbbb4b96d0ddbee21c0cd7b9e12712
    image: ghcr.io/pet-eng-comp-org/siteestatisticas-backend@sha256:ee3909c78c27f1ca7eedfd01dfeff6891198e5a375f038d59ecdaf1588387967
    logging: *logging
    restart: always
    environment:
      TOKEN_SECRET: ${TOKEN_SECRET}
      BACKEND_PORT: 80
      # O banco vive no volume, nao na imagem: importacao sobrevive a redeploy.
      DATABASE_PATH: /app/data/database.sqlite
    volumes:
      - estatisticas_dados:/app/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.estatisticasbackend.entrypoints=web, websecure
      - traefik.http.routers.estatisticasbackend.tls=true
      - traefik.http.routers.estatisticasbackend.tls.certresolver=le
      - traefik.http.routers.estatisticasbackend.rule=Host(`apiestatisticas.pet.inf.ufes.br`)
      - traefik.http.services.estatisticasbackend.loadbalancer.server.port=80
      - traefik.docker.network=traefik

  frontend:
    # ghcr.io/pet-eng-comp-org/siteestatisticas-frontend:sha-c0e43e5a13ad9a5274df8e31cba7289dd8f5bee6
    image: ghcr.io/pet-eng-comp-org/siteestatisticas-frontend@sha256:b9247361b992acb562f26b84f5b88001a78188672289cfdbef0f44f35b401966
    logging: *logging
    restart: always
    depends_on:
      - backend
    environment:
      # Lida no boot do container para gerar o config.js.
      REACT_APP_API_URL: https://apiestatisticas.pet.inf.ufes.br/
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.estatisticasfrontend.entrypoints=web, websecure
      - traefik.http.routers.estatisticasfrontend.tls=true
      - traefik.http.routers.estatisticasfrontend.tls.certresolver=le
      - traefik.http.routers.estatisticasfrontend.rule=Host(`estatistica.pet.inf.ufes.br`)
      - traefik.http.services.estatisticasfrontend.loadbalancer.server.port=80
      - traefik.docker.network=traefik

volumes:
  # Externo: apagar ou recriar a stack nao leva o banco junto.
  estatisticas_dados:
    external: true
    name: estatisticas_dados

networks:
  # A rede e da stack do Traefik: apagar esta stack nao pode tentar remove-la.
  traefik:
    name: traefik
    external: true
