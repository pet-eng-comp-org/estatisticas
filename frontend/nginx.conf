server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    # O bundle leva hash no nome: trocar o conteudo troca a URL, entao pode
    # ser guardado para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A fonte vem de public/ e o nome nao tem hash. Guardar por uma semana, e
    # sem "immutable": trocar o arquivo precisa chegar a quem ja visitou, e
    # com immutable o navegador nem perguntaria.
    location /fonts/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Rotas do lado do cliente: qualquer caminho cai no index.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
